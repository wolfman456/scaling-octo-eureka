spring.h2.console.enabled=false

# Railway-managed Postgres (DATABASE_URL-style creds via PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:gallery}
spring.datasource.username=${PGUSER:gallery}
spring.datasource.password=${PGPASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver
# No explicit hibernate.dialect: Boot 4 / Hibernate 7 resolve it from the JDBC
# metadata of the PostgreSQL driver, which is a runtime dependency. Pinning the class
# name only adds a way to break the boot if the dialect moves.
