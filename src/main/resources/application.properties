spring.application.name=gallery-backend
server.port=${PORT:8080}

# Runtime content store: H2 file DB persists across restarts; uploads live on disk
spring.datasource.url=jdbc:h2:file:./data/gallery
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart uploads (images in MVP)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Where admin-uploaded media is stored and served from (/uploads/**)
app.upload-dir=./uploads
app.cors.allowed-origins=http://localhost:5173

# Admin credentials come from the environment (no defaults in production)
app.admin.user=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:changeme}