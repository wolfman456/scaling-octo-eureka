spring.application.name=gallery-backend
server.port=${PORT:8080}

# Runtime content store: H2 file DB persists across restarts; uploads live on disk
spring.datasource.url=jdbc:h2:file:./data/gallery
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart uploads (images in MVP)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Where admin-uploaded media is stored and served from (/uploads/**)
app.upload-dir=./uploads
# Full-resolution originals are kept outside the served directory (never reachable via /uploads)
app.original-dir=${APP_ORIGINALS_DIR:./originals}
app.cors.allowed-origins=http://localhost:5173

# Uploaded photos are downscaled to this longest edge; originals are kept under uploads/originals
app.image.max-dimension=2000
# Grid thumbnails generated beside each display image (name_thumb.jpg)
app.image.thumb-dimension=480
app.image.quality=0.82

# Initial admin seed: applied only on first boot, then stored in the DB
# (change the password afterwards from the admin "Account" tab)
app.admin.user=${ADMIN_USER:bloodwolf}
app.admin.password=${ADMIN_PASSWORD:NeedToChange}

# OpenAI-assisted writing helpers (gallery descriptions + article drafts).
# Empty key disables AI endpoints (503). Feature is admin-only and stateless.
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=https://api.openai.com/v1
app.openai.model=gpt-4o-mini
app.openai.timeout-ms=30000